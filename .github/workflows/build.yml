name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Test (satellites, DSP, sources, plugins, engine)
        working-directory: core
        run: cargo test --release --workspace

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the Rust core for Android
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          set -o pipefail
          if ! cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 26 -o ../android/app/src/main/jniLibs build --release -p sh-android 2>&1 | tee build.log; then
            # Errors as an annotation, readable without the log download
            msg=$(grep -E "^(error|warning: unused)" -A12 build.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Rust Android build::$msg"
            exit 1
          fi
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log; then
            msg=$(grep -E "^e: |error:|What went wrong" -A6 gradle.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../SatHunterSDR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SatHunterSDR-apk
          path: SatHunterSDR.apk
      - name: Release (tags v*, or a release published on GitHub)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: SatHunterSDR.apk
          # v0.2.0-beta1 and the like are pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: docs/RELEASE_NOTES.md
